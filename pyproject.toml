[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pi500-oled-panel"
version = "0.1.1.dev1"
description = "Raspberry Pi 500 OLED dashboard and bounded Desktop/Headless boot chooser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aaron Arzamendi"}]
requires-python = ">=3.12"
dependencies = ["Pillow>=12,<13", "psutil>=5.9,<8"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
pi = ["luma.oled>=3.15,<4"]

[project.urls]
Homepage = "https://github.com/aarzamen/pi500-oled-panel"
Issues = "https://github.com/aarzamen/pi500-oled-panel/issues"

[tool.setuptools]
py-modules = ["hardware_check"]

[tool.setuptools.packages.find]
include = ["oled_panel*"]

[tool.setuptools.package-data]
oled_panel = ["assets/*.png"]
